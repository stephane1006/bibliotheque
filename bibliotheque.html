<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma bibliothèque</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4e5f'/%3E%3Crect x='5' y='8' width='5' height='17' rx='1' fill='%23f4d58d'/%3E%3Crect x='11' y='11' width='5' height='14' rx='1' fill='%23e9eef0'/%3E%3Crect x='17' y='6' width='5' height='19' rx='1' fill='%23e07a5f'/%3E%3Crect x='23' y='10' width='5' height='15' rx='1' fill='%238fb8c8'/%3E%3Crect x='3' y='25' width='26' height='2.5' rx='1' fill='%23c9a26b'/%3E%3C/svg%3E">
<style>
:root{--bg:#e9eef0;--fg:#1c2630;--mut:#5d6b75;--card:#fff;--bd:#c9d3d8;--ac:#1f4e5f;--wood:#7a5c3e}
@media(prefers-color-scheme:dark){:root{--bg:#12181c;--fg:#e6ecef;--mut:#92a0a8;--card:#1c252b;--bd:#33414a;--ac:#5fa8bf;--wood:#5a4430}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Georgia,serif;background:var(--bg);color:var(--fg)}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
h1{font-size:20px;margin:0;flex:1;font-weight:700}
#tg{border-radius:999px;font-family:system-ui,sans-serif;font-size:14px;min-width:84px}
#add{width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--bg);border:0;font-size:26px;padding:0;line-height:1}
#dots{border:0;background:none;color:var(--mut);font-size:22px;padding:2px 8px}
#menu{position:absolute;right:12px;top:58px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;display:none;flex-direction:column;gap:6px;width:250px;font-family:system-ui,sans-serif;font-size:14px;z-index:9}
#menu.on{display:flex}#gs{color:var(--mut);font-size:12px}
main{padding:16px 14px 50px;max-width:900px;margin:0 auto}
.row{display:flex;align-items:flex-end;gap:4px;border-bottom:9px solid var(--wood);padding:0 8px;margin-bottom:18px;min-height:90px}
.sp{color:#fff;border:0;border-radius:3px 3px 0 0;padding:8px 4px;writing-mode:vertical-rl;font:500 15px/1.25 system-ui,sans-serif;overflow:hidden;position:relative;flex:none;text-align:start}
.dd{position:relative}.dd input{padding-right:40px}.ar{position:absolute;right:2px;top:2px;height:36px;width:36px;padding:0;border:0;background:none;font-size:16px}
.dl{position:absolute;left:0;right:0;top:100%;z-index:8;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:220px;overflow:auto;display:none;font:15px system-ui,sans-serif;color:var(--fg)}.dl.on{display:block}.dl div{padding:10px;border-bottom:1px solid var(--bd)}
.ck{position:absolute;top:5px;left:0;right:0;text-align:center;writing-mode:horizontal-tb;font-size:14px}
.mut{color:var(--mut)}
label.t{display:block;font:13px system-ui,sans-serif;color:var(--mut);margin-top:10px}
input[type=text],input[type=number],textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);font-family:system-ui,sans-serif}
.two{display:flex;gap:8px}.two>div{flex:1}
.cv{width:96px;height:140px;border-radius:4px;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font:12px system-ui,sans-serif;color:var(--mut);text-align:center;flex:none}
.lu{display:flex;gap:10px;align-items:center;font:17px system-ui,sans-serif;margin:16px 0}
.lu input{width:24px;height:24px}
.prim{background:var(--ac);color:var(--bg);border:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;font-family:system-ui,sans-serif}
.op{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px;cursor:pointer}
.tx{min-width:0;flex:1}.tx b{display:block;font:600 14px/1.3 system-ui,sans-serif}.tx span{display:block;font:12px/1.4 system-ui,sans-serif;color:var(--mut)}
.cv.s{width:44px;height:64px;font-size:11px}
.logo{width:34px;height:34px;flex:none}
</style></head><body>
<header><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1f4e5f"/><rect x="5" y="8" width="5" height="17" rx="1" fill="#f4d58d"/><rect x="11" y="11" width="5" height="14" rx="1" fill="#e9eef0"/><rect x="17" y="6" width="5" height="19" rx="1" fill="#e07a5f"/><rect x="23" y="10" width="5" height="15" rx="1" fill="#8fb8c8"/><rect x="3" y="25" width="26" height="2.5" rx="1" fill="#c9a26b"/></svg><h1>Ma bibliothèque</h1><button id="tg" aria-label="Changer le classement"></button><button id="add" aria-label="Ajouter un livre">+</button><button id="dots" aria-label="Sauvegarde">⋯</button></header>
<div id="menu"><button data-a="exp">Exporter une sauvegarde</button><button data-a="imp">Importer une sauvegarde</button><button data-a="goo" id="goo"></button><span id="gs"></span><input type="file" id="fj" accept=".json" hidden></div>
<main></main>
<script>
const K='biblio_v1',CID='387611440427-ct3qqc7hur26fatanne33a7c5sq1slvt.apps.googleusercontent.com';
let D=JSON.parse(localStorage.getItem(K)||'{"updated":0,"books":[]}'),mode='serie',sel=null,view='shelf',cur=null,draft={},tok=null,exp=0,tc,timer;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#1f4e5f','#7a2e3a','#3d5a2a','#4b3a7a','#8a5a1c','#2d4f7c','#6b3a55','#44484d'];
const hs=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const key=b=>mode=='serie'?(b.series||b.title):(b.author||'Auteur inconnu');
const AZ=(a,b)=>a.localeCompare(b,'fr',{sensitivity:'base',numeric:true});
const cmp=(a,b)=>(+a.year||9999)-(+b.year||9999)||(+a.volume||0)-(+b.volume||0)||AZ(a.title,b.title);
const gs=t=>$('#gs').textContent=t;
function save(){D.updated=Date.now();localStorage.setItem(K,JSON.stringify(D));if(localStorage.getItem('biblio_g')){clearTimeout(timer);timer=setTimeout(()=>sync(),2500)}}
function spine(label,done,k,attr){const n=label.length,L=Math.min(3,Math.ceil(n/12)),w=L==1?38:L*20+18,h=Math.min(175,L==1?Math.round(n*8.2)+34:Math.round(Math.ceil(n/L)*8.2)+34)+(done?20:0);return {w,html:`<button class="sp" ${attr} style="width:${w}px;height:${h}px;background:${COL[hs(k)%COL.length]};white-space:${L>1?'normal':'nowrap'};${done?'padding-top:28px':''}" title="${esc(label)}">${done?'<span class="ck">✓</span>':''}${esc(label)}</button>`}}
function rows(items){const W=Math.min(innerWidth,900)-28-16;let h='',r=[],x=0;const fl=()=>{if(r.length)h+=`<div class="row">${r.join('')}</div>`;r=[];x=0};items.forEach(t=>{if(x+t.w+4>W)fl();r.push(t.html);x+=t.w+4});fl();return h||'<p class="mut">Ta bibliothèque est vide. Appuie sur + pour ajouter ton premier livre.</p>'}
const lbl=b=>{if(mode!='serie'||!b.volume)return b.title;const t=b.title.replace(sel,'').replace(/^[\s:·-]+/,'').trim();return 'T'+b.volume+(t&&!/^(T|tome|vol\.?)?\s*\d+$/i.test(t)?' · '+t:'')};
const cvr=c=>c?`<img class="cv" src="${esc(c)}" alt="Couverture">`:'<div class="cv">Pas de couverture</div>';
function render(){
 $('#tg').textContent=mode=='serie'?'Série':'Auteur';
 $('#goo').textContent=localStorage.getItem('biblio_g')?'Synchroniser avec Google':'Activer la sauvegarde Google';
 const m=$('main');scrollTo(0,0);
 if(view=='form')return m.innerHTML=formHTML();
 if(view=='book')return m.innerHTML=bookHTML();
 if(sel!==null){const bs=D.books.filter(b=>key(b)===sel).sort(cmp);
  return m.innerHTML=`<p><button data-a="back">‹ Retour</button> <b>${esc(sel)}</b> <span class="mut">${bs.filter(b=>b.read).length}/${bs.length} lus</span></p>`+rows(bs.map(b=>spine(lbl(b),b.read,sel,`data-b="${b.id}"`)))}
 const g={};D.books.forEach(b=>(g[key(b)]=g[key(b)]||[]).push(b));
 m.innerHTML=rows(Object.keys(g).sort(AZ).map(k=>{const bs=g[k];return bs.length==1?spine(k,bs[0].read,k,`data-b="${bs[0].id}"`):spine(k,bs.every(b=>b.read),k,`data-g="${esc(k)}"`)}))}
function bookHTML(){const b=cur;const p=[b.series?esc(b.series)+(b.volume?' T'+esc(b.volume):''):'',esc(b.year),esc(b.publisher),b.pages?esc(b.pages)+' p.':'',esc(b.genre)].filter(Boolean).join(' · ');
 return `<p><button data-a="back">‹ Retour</button></p><div style="display:flex;gap:14px">${cvr(b.cover)}<div><h2 style="margin:0">${esc(b.title)}</h2><p class="mut" style="margin:4px 0">${esc(b.author)}</p><p class="mut" style="margin:4px 0;font-size:14px">${p}</p></div></div><p>${esc(b.summary)}</p><label class="lu"><input type="checkbox" id="rd" ${b.read?'checked':''}> Lu</label><div class="btns"><button data-a="edit">Modifier</button><button data-a="del">Supprimer</button></div>`}
function formHTML(){const d=draft,dd=['author','series','title','genre'],f=(id,l,v,t='text')=>{const i=`<input type="${t}" id="f_${id}" value="${esc(v)}" autocomplete="off">`;return `<label class="t">${l}${dd.includes(id)?`<div class="dd">${i}<button type="button" class="ar" data-ar="${id}" aria-label="Choisir dans la liste">▾</button><div class="dl" id="dl_${id}"></div></div>`:i}</label>`};
 return `<p><button data-a="back">‹ Annuler</button></p><h2 style="margin:0 0 4px">${d.id?'Modifier le livre':'Nouveau livre'}</h2>${f('author','Auteur',d.author)}${f('title','Titre',d.title)}<div class="two">${f('series','Série',d.series)}${f('volume','Tome',d.volume,'number')}</div><div class="btns"><button data-a="search" class="prim">Chercher les infos sur Internet</button></div><div id="msg" class="mut" style="font:13px system-ui;margin-top:6px"></div><div id="res"></div><div class="two">${f('year','Année',d.year,'number')}${f('pages','Pages',d.pages,'number')}</div>${f('publisher','Éditeur',d.publisher)}${f('genre','Catégorie / genre',d.genre)}<label class="t">Résumé<textarea id="f_summary" rows="4">${esc(d.summary)}</textarea></label><label class="t">Couverture</label><div style="display:flex;gap:12px;align-items:flex-start"><div id="pv">${cvr(d.cover)}</div><div class="btns" style="margin:0;flex-direction:column;align-items:stretch"><button data-a="pick">Importer une image</button><button data-a="cam">Prendre une photo</button><button data-a="nocv">Supprimer la couverture</button></div></div><input type="file" id="fi" accept="image/*" hidden><input type="file" id="fc" accept="image/*" capture="environment" hidden><div class="btns"><button data-a="ok" class="prim">Valider</button></div>`}
const val=id=>$('#f_'+id).value.trim(),msg=t=>$('#msg').textContent=t;
let cands=[];
const GEN=g=>!g?'':/comic|graphic|manga/i.test(g)?'Manga / BD':/juvenile|young adult/i.test(g)?'Jeunesse':/fiction/i.test(g)?'Roman':g;
async function search(){const a=val('author'),v0=String(+val('volume')||''),t=val('title')||val('series');if(!t)return msg('Saisis au moins le titre.');const T=t+(v0&&!/\d/.test(t)?' tome '+v0:'');msg('Recherche en cours…');$('#res').innerHTML='';const L=[];
 const q=encodeURIComponent('intitle:'+T+(a?' inauthor:'+a:''));
 for(const lg of ['&langRestrict=fr','']){try{const j=await(await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=10'+lg+'&q='+q)).json();(j.items||[]).forEach(x=>{const v=x.volumeInfo||{};L.push({title:[v.title,v.subtitle].filter(Boolean).join(' : '),author:(v.authors||[]).join(', '),year:(v.publishedDate||'').slice(0,4),publisher:v.publisher||'',pages:v.pageCount||'',genre:GEN((v.categories||[])[0]),summary:(v.description||'').replace(/<[^>]+>/g,' ').trim(),cover:(v.imageLinks?.thumbnail||'').replace('http:','https:')})})}catch(e){}if(L.length)break}
 try{const j=await(await fetch('https://openlibrary.org/search.json?limit=5&title='+encodeURIComponent(T)+(a?'&author='+encodeURIComponent(a):''))).json();(j.docs||[]).forEach(d=>L.push({title:d.title||'',author:(d.author_name||[]).slice(0,2).join(', '),year:d.first_publish_year||'',publisher:d.publisher?.[0]||'',pages:d.number_of_pages_median||'',genre:GEN(d.subject?.[0]),summary:'',key:d.key,cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':''}))}catch(e){}
 const seen=new Set();cands=L.filter(c=>{const k=(c.title+c.author+c.year+c.publisher).toLowerCase();if(!c.title||seen.has(k))return false;seen.add(k);return true});
 if(v0){const has=c=>(c.title.match(/\d+/g)||[]).includes(v0)?1:0;cands.sort((x,y)=>has(y)-has(x))}
 cands=cands.slice(0,8);
 if(!cands.length)return msg('Rien trouvé. Remplis les champs à la main.');
 if(cands.length==1)return pick(0);
 msg(cands.length+' résultats. Choisis le bon livre.');
 $('#res').innerHTML=cands.map((c,i)=>`<div class="op" data-c="${i}" role="button" tabindex="0">${c.cover?`<img class="cv s" src="${esc(c.cover)}" alt="">`:'<div class="cv s">Couv.</div>'}<div class="tx"><b>${esc(c.title)}</b><span>${esc(c.author)}</span><span>${[c.publisher,c.year].filter(Boolean).map(esc).join(' · ')}</span></div></div>`).join('')+'<button data-a="nores" style="width:100%;margin-top:10px;font-size:13px">Aucun ne correspond, je remplis à la main</button>'}
async function pick(i){const c=cands[i];$('#res').innerHTML='';
 if(!c.summary&&c.key){try{const w=await(await fetch('https://openlibrary.org'+c.key+'.json')).json(),x=w.description;c.summary=(typeof x=='string'?x:x?.value)||''}catch(e){}}
 ['author','title'].forEach(k=>{if(!val(k)&&c[k])$('#f_'+k).value=c[k]});
 ['year','pages','publisher','genre','summary'].forEach(k=>{if(c[k])$('#f_'+k).value=c[k]});
 if(c.cover){draft.cover=c.cover;$('#pv').innerHTML=cvr(c.cover)}
 msg(c.cover?'Infos remplies. Vérifie puis valide.':'Infos remplies, mais pas de couverture : importe une image ou prends une photo.')}
function fromSeries(n){const bs=D.books.filter(b=>b.series===n);if(!bs.length)return;if(!val('author'))$('#f_author').value=bs[bs.length-1].author||'';if(!val('volume'))$('#f_volume').value=Math.max(0,...bs.map(b=>+b.volume||0))+1}
function img(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,220/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(file)})}
function gtok(){return new Promise((ok,ko)=>{if(tok&&Date.now()<exp)return ok(tok);if(!window.google?.accounts)return ko('indisponible hors connexion');
 tc=tc||google.accounts.oauth2.initTokenClient({client_id:CID,scope:'https://www.googleapis.com/auth/drive.file',callback:()=>{}});
 tc.callback=r=>{if(r.access_token){tok=r.access_token;exp=Date.now()+(r.expires_in-60)*1000;localStorage.setItem('biblio_g','1');ok(tok)}else ko(r.error||'refusé')};
 tc.error_callback=e=>ko('reconnecte-toi ('+(e.type||'erreur')+')');
 tc.requestAccessToken({prompt:localStorage.getItem('biblio_g')?'':'consent'})})}
async function sync(){try{const H={Authorization:'Bearer '+await gtok()},U='https://www.googleapis.com/';gs('Synchronisation…');
 const l=await(await fetch(U+'drive/v3/files?fields=files(id)&q='+encodeURIComponent("name='Bibliotheque-livres.json' and trashed=false"),{headers:H})).json();const f=l.files?.[0];
 if(f){const r=await(await fetch(U+'drive/v3/files/'+f.id+'?alt=media',{headers:H})).json();
  if(r.updated>D.updated){D=r;localStorage.setItem(K,JSON.stringify(D));render();return gs('Bibliothèque mise à jour depuis Google Drive')}
  await fetch(U+'upload/drive/v3/files/'+f.id+'?uploadType=media',{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(D)})}
 else await fetch(U+'upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{...H,'Content-Type':'multipart/related; boundary=bb'},body:'--bb\r\nContent-Type: application/json\r\n\r\n{"name":"Bibliotheque-livres.json"}\r\n--bb\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(D)+'\r\n--bb--'});
 gs('Sauvegardé sur Google à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}))}catch(e){gs('Google : '+e)}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-g],[data-b],[data-a],[data-ar],[data-o],[data-c],#tg,#add,#dots');if(!t){if(!e.target.closest('#menu'))$('#menu').classList.remove('on');document.querySelectorAll('.dl').forEach(x=>x.classList.remove('on'));return}
 const d=t.dataset,a=d.a;
 if(t.id=='tg'){mode=mode=='serie'?'auteur':'serie';sel=null;view='shelf';render()}
 else if(t.id=='add'){draft={};view='form';render()}
 else if(t.id=='dots')$('#menu').classList.toggle('on');
 else if(d.ar){const id=d.ar,l=$('#dl_'+id),on=l.classList.contains('on');document.querySelectorAll('.dl').forEach(x=>x.classList.remove('on'));if(!on){const v=[...new Set(D.books.map(b=>b[id]).filter(Boolean))].sort(AZ);l.innerHTML=v.length?v.map(x=>`<div data-o="${esc(x)}" data-f="${id}">${esc(x)}</div>`).join(''):'<div class="mut">Aucune entrée pour le moment</div>';l.classList.add('on')}}
 else if(d.o!==undefined){$('#f_'+d.f).value=d.o;document.querySelectorAll('.dl').forEach(x=>x.classList.remove('on'));if(d.f=='series')fromSeries(d.o)}
 else if(d.c!==undefined)pick(+d.c)
 else if(d.g!==undefined){sel=d.g;render()}
 else if(d.b){cur=D.books.find(x=>x.id===d.b);view='book';render()}
 else if(a=='back'){if(view!='shelf')view='shelf';else sel=null;render()}
 else if(a=='edit'){draft={...cur};view='form';render()}
 else if(a=='del'){if(confirm('Supprimer ce livre ?')){D.books=D.books.filter(b=>b.id!==cur.id);save();view='shelf';if(sel!==null&&!D.books.some(b=>key(b)===sel))sel=null;render()}}
 else if(a=='search')search();
 else if(a=='nores'){$('#res').innerHTML='';msg('')}
 else if(a=='nocv'){draft.cover='';$('#pv').innerHTML=cvr('')}
 else if(a=='pick')$('#fi').click();
 else if(a=='cam')$('#fc').click();
 else if(a=='ok'){if(!val('title'))return msg('Le titre est obligatoire.');
  const o={...draft,author:val('author'),title:val('title'),series:val('series'),pages:val('pages'),genre:val('genre'),volume:+val('volume')||'',year:val('year'),publisher:val('publisher'),summary:val('summary')};
  if(o.id)Object.assign(D.books.find(b=>b.id===o.id),o);else{o.id=Date.now().toString(36);o.read=false;D.books.push(o)}
  save();view='shelf';sel=null;render()}
 else if(a=='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));l.download='bibliotheque-'+new Date().toISOString().slice(0,10)+'.json';l.click()}
 else if(a=='imp')$('#fj').click();
 else if(a=='goo')sync()});
document.addEventListener('change',async e=>{const t=e.target,f=t.files?.[0];
 if(t.id=='rd'){cur.read=t.checked;save()}
 else if((t.id=='fi'||t.id=='fc')&&f){draft.cover=await img(f);$('#pv').innerHTML=cvr(draft.cover)}
 else if(t.id=='fj'&&f){try{const j=JSON.parse(await f.text());if(!Array.isArray(j.books))throw 0;if(confirm('Remplacer la bibliothèque actuelle par cette sauvegarde ?')){D=j;save();sel=null;view='shelf';render()}}catch(x){alert('Ce fichier n\'est pas une sauvegarde valide.')}t.value=''}});
addEventListener('resize',()=>{if(view=='shelf')render()});
render();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="if(localStorage.getItem('biblio_g'))sync()"></script>
</body></html>
